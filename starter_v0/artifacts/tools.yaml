# v2 — Concise tool declarations: WHEN to use / WHEN NOT to use + arg conventions.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại user hoặc xin xác nhận bằng tool này (không trả text suông). Dùng khi thiếu handle/URL ('text') hoặc cần xác nhận trước `send` ('yes_no'). Không dùng cho câu ngoài phạm vi (toán/code) hay câu hỏi meta."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi ngắn"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "'text' khi thiếu info; 'yes_no' khi xin xác nhận send"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy tweet gần đây CỦA một tài khoản Twitter cụ thể (kể cả khi user đổi tên người). Không dùng nếu thiếu tên người (dùng `clarify`) hoặc tìm theo chủ đề (dùng `social_search`)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle không có @ (Sam Altman->'sama', Elon Musk->'elonmusk', Andrej Karpathy->'karpathy')"}
        limit: {type: integer, default: 5, description: "Số tweet user yêu cầu (ví dụ 3, 10; mặc định 5)"}
      required: [screenname]

  - name: social_search
    description: "Tìm tweet trên Twitter theo từ khóa/chủ đề. Không dùng cho tweet của 1 người cụ thể (dùng `timeline`), hoặc khi user bảo bỏ Twitter chuyển sang web (dùng `lookup`)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề ngắn (ví dụ: 'GPT-5', 'AI')"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "'Top' nếu hỏi phổ biến/top nhất; mặc định 'Latest'"}
        limit: {type: integer, default: 5, description: "Số tweet"}
      required: [query]

  - name: lookup
    description: "Tìm kiếm và xem tin tức trên WEB (Tavily). Dùng cho tin tức thời sự/công nghệ hoặc khi chuyển từ Twitter sang web. Không dùng khi đã có URL (dùng `fetch`), thiếu URL (dùng `clarify`), hoặc tìm paper arXiv (dùng `papers`)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ ghi từ khóa chủ đề ngắn ('AI', 'robotics', 'OpenAI'). Không thêm 'news', 'tin tức', 'today', 'hôm nay'"}
        topic: {type: string, enum: [general, news], default: "general", description: "Chỉ chọn 'general' hoặc 'news' (cấm 'tech'). Chọn 'news' cho mọi câu hỏi tin tức"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "'hôm nay'->'day', 'tuần này'->'week', 'tháng này'->'month', 'năm nay'->'year'"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung trực tiếp từ một URL http/https cụ thể. Dùng khi user đưa link URL. Không dùng khi không có URL (dùng `clarify`)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ (http:// hoặc https://)"}
      required: [url]

  - name: format
    description: "Định dạng danh sách item đã có thành bản tin markdown. Chỉ dùng sau khi đã có dữ liệu."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Các mục đã có để trình bày; mỗi mục có thể gồm tiêu đề, URL, nguồn, tóm tắt và tên mục/section."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Mẫu bản tin"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi bản tin lên Telegram. CHỈ gọi với confirmed=true SAU KHI user đã đồng ý; nếu chưa xác nhận, bắt buộc gọi `clarify(response_type='yes_no')` trước."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung cần gửi"}
        confirmed: {type: boolean, default: false, description: "Chỉ true sau khi user xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu chính sách nội bộ công ty. Không dùng cho câu hỏi meta về trợ lý."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Câu hỏi hoặc cụm từ mô tả chính sách cần tra cứu; nêu rõ chủ đề để tìm đúng mục."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Giới hạn tìm kiếm vào nhóm chính sách phù hợp; chọn all nếu chưa biết nhóm hoặc muốn tìm trên toàn bộ tài liệu."}
        top_k: {type: integer, default: 3, description: "Số mục chính sách phù hợp tối đa muốn nhận; mặc định 3."}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học trên arXiv. Không dùng cho tin tức web/công nghệ (dùng `lookup`)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa học thuật"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Trích text PDF của bài báo arXiv. Không dùng cho link web thường (dùng `fetch`)."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID hoặc URL"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: hackernews
    description: "Tìm bài thảo luận trên Hacker News (hn.algolia.com). Chỉ dùng khi user hỏi rõ về Hacker News / HN. Không dùng cho tin web chung (dùng `lookup`) hay Twitter (dùng `social_search`)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm trên Hacker News"}
        sort_by: {type: string, enum: [relevance, date], default: "relevance", description: "'date' cho bài mới nhất; 'relevance' cho bài liên quan nhất"}
        limit: {type: integer, default: 5, description: "Số bài cần lấy"}
      required: [query]
